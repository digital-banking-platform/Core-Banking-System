server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: http://account-service:8082
              predicates:
                - Path=/accounts/**,/profile/**,/admin/accounts/**,/admin/profiles/**
              filters:
                - addUserHeaders
            - id : auth-public
              uri: http://auth-service:8081
              predicates:
                - Path=/Auth/login,/Auth/register,/Auth/refresh,/Auth/logout

            - id : auth-admin
              uri: http://auth-service:8081
              predicates:
                - Path=/admin/auth/**
              filters:
                - addUserHeaders
            - id: Transaction-services
              uri: http://transaction-service:8083
              predicates:
                - Path=/payment-transactions/**
              filters:
                - addUserHeaders


